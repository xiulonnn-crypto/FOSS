<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>期权卖方助手 · 云端复盘</title>
  <!-- GitHub Pages 若以仓库根为站点根（main / root），此页把访问者带到 docs/ 下的只读复盘页。 -->
  <meta http-equiv="refresh" content="0; url=./docs/" />
  <link rel="canonical" href="./docs/" />
  <script>
    // 保留 #hash（如 #review），并立即跳转，避免等待 meta refresh。
    (function () {
      var hash = location.hash || '#review';
      location.replace('./docs/' + hash);
    })();
  </script>
  <style>
    body { background:#0b1120; color:#cbd5e1; font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
           display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    a { color:#818cf8; }
  </style>
</head>
<body>
  <p>正在前往云端复盘页…若未自动跳转，请点击 <a href="./docs/#review">这里</a>。</p>
</body>
</html>
